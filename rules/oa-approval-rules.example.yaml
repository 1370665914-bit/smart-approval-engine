# OA 审批规则配置模板（oa-approval-rules.example.yaml）
# 用法：复制为 oa-approval-rules.yaml，按公司制度填入实际口径。
# 本文件不包含任何公司内部信息，所有数值与文案均为示例。

# ============================================================
# 一、示例流程：费用报销申请
# ============================================================
expense_reimbursement:
  workflow_name: "费用报销申请"   # 按实际流程名称填写

  # ---- 导航路径（按实际 OA 调整）----
  navigation:
    entry: "九宫格入口 → 流程"
    filter: "左侧菜单 → 财务管理 → 费用报销申请"
    open_detail: "双击待办列表中的行，在新 tab 打开详情"
    page_url_pattern: "<按实际 OA 模板填写>"
    list_url: "<按实际 OA 填写>"

  # ---- 操作流程 ----
  operation_steps:
    step_1: "读取 AI 审核意见"
    step_2: "根据 ai_review_rules 判断：批准 or 跳过（交人工）"
    step_3_if_approve:
      - "填写签字意见"
      - "点击批准按钮"
    step_3_if_skip:
      - "不做任何操作"
      - "翻到下一条或回到列表"

  # ---- AI 审核判定规则（示例，按公司口径替换）----
  ai_review_rules:
    approve:
      - condition: "AI 审核反馈包含'审核通过'或'无异常'"
        opinion: "审核通过"
      - condition: "补贴计算天数 ≤ 差旅总天数"
        description: "补贴少算，对公司有利，属正常"
        opinion: "审核通过"
    skip:
      - condition: "补贴计算天数 > 差旅总天数"
        reason: "补贴多算，可能有问题"
      - condition: "发票异常（验真不通过）"
        reason: "发票验真未通过"
      - condition: "抬头不符（发票抬头为空或与报销主体不一致）"
        reason: "发票抬头异常"
      - condition: "其他任何异常提示"
        reason: "AI 审核发现异常，留给人工"

# ============================================================
# 二、示例流程：合同付款申请
# ============================================================
contract_payment:
  workflow_name: "合同付款申请"
  auto_approve:
    enabled: false   # 付款类默认不自动批准
  checklist:
    - name: 合同关联
      items:
        - 有合同台账关联
        - 收款单位与合同对方一致
    - name: 发票信息
      items:
        - 发票抬头 = 付款主体
        - 发票金额 = 付款金额
        - 发票类型符合制度要求
    - name: 收款信息
      items:
        - 收款单位名称
        - 收款账号
        - 收款开户行
    - name: 附件
      required: [发票PDF, 合同/订单]
      optional: [验收单, 结算单]

# ============================================================
# 三、示例流程：非合同用印申请
# ============================================================
non_contract_seal:
  workflow_name: "非合同用印申请"
  auto_approve:
    enabled: true
    conditions:
      - "用印类型在 [证明, 授权书, 申请表] 范围内"
      - "前置审批已通过"

# ============================================================
# 四、全局配置
# ============================================================
global:
  ignore:
    - 预算余额   # 由系统自动校验

  logging:
    output: "memory/oa-approval-log.md"
    fields: [流程编号, 流程类型, 申请人, 金额, AI审核结果, 审批结果, 审批意见, 时间]

  exceptions:
    pause_and_ask: [发票抬头不匹配, 金额差异超阈值, 附件缺失, 未知流程类型]
    auto_reject: [发票已过期超年限, 重复提交相同发票号]

# ============================================================
# 五、审批复盘（示例格式，按需保留）
# ============================================================
# 【经验教训示例】
#   1. 必须先填签字意见再点批准，否则流程节点不显示审批意见
#   2. 从待办事项页面进入更高效，可按分类筛选
#   3. AI 审核常见异常类型需沉淀为规则
#   4. 详情页翻页后确认框需点确定
#   5. 批准后页面标题变化可确认审批成功
